[package]
name = "procx"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Advanced Windows process and system monitoring suite"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.37"
egui_plot = "0.38"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "user"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
crossbeam-channel = "0.5"
egui_extras = { version = "0.37", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Wdk_System_Threading",
] }

# Non-Windows builds exist only so the platform-independent core can be
# developed and unit-tested on Linux/CI. winit needs a windowing backend there.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
